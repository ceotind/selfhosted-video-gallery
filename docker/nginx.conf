server {
    listen 80;
    server_name _;

    root /app/dist;
    index index.html;

    charset utf-8;
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The site itself.
    location / {
        try_files $uri $uri/ =404;
    }

    # Video files, straight off disk. Byte ranges are what makes seeking work.
    location /v/ {
        alias /data/videos/;
        add_header Cache-Control "public, max-age=604800";
        add_header Accept-Ranges bytes;
        default_type video/mp4;
        types {
            video/mp4 mp4 m4v;
            video/webm webm;
            video/quicktime mov;
            video/x-matroska mkv;
            video/ogg ogv;
        }
    }

    # Posters never change for a given video id.
    location /p/ {
        alias /data/posters/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type image/webp;
    }

    location = /m/durations.json {
        alias /data/meta/durations.json;
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    # Folder index. Regenerated at container start, so keep it short lived.
    location /m/ {
        alias /data/meta/;
        add_header Cache-Control "public, max-age=60";
        default_type application/json;
    }
}
