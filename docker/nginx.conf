# Use the protocol the outer proxy reports, so cookies get the Secure flag behind TLS.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Only redirect when something upstream tells us the visitor is on http.
map $http_x_forwarded_proto $need_https {
    default 0;
    "http" 1;
}

server {
    listen 80;
    server_name _;

    root /app/dist;
    index index.html;

    # Keep redirects relative. Without this nginx drops the port and the host.
    absolute_redirect off;

    if ($need_https) {
        return 301 https://$host$request_uri;
    }

    charset utf-8;
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Any 401 from the login service sends the person to the login page.
    error_page 401 = @to_login;

    location @to_login {
        return 302 /login?next=$request_uri;
    }

    # nginx asks this on every protected request. 204 allows, 401 blocks.
    location = /__auth {
        internal;
        proxy_pass http://127.0.0.1:9000/__auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Login page and the form endpoints. Never cached, never protected.
    location = /login {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location /admin {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Video files, straight off disk. Byte ranges are what makes seeking work.
    location /v/ {
        auth_request /__auth;
        alias /data/videos/;
        add_header Cache-Control "private, max-age=604800";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Accept-Ranges bytes;
        default_type video/mp4;
        types {
            video/mp4 mp4 m4v;
            video/webm webm;
            video/quicktime mov;
            video/x-matroska mkv;
            video/ogg ogv;
        }
    }

    # Posters never change for a given video id.
    location /p/ {
        auth_request /__auth;
        alias /data/posters/;
        add_header Cache-Control "private, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        default_type image/webp;
    }

    location = /m/durations.json {
        auth_request /__auth;
        alias /data/meta/durations.json;
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000" always;
        default_type application/json;
    }

    # Folder index. Regenerated at container start, so keep it short lived.
    location /m/ {
        auth_request /__auth;
        alias /data/meta/;
        add_header Cache-Control "private, max-age=60";
        add_header Strict-Transport-Security "max-age=31536000" always;
        default_type application/json;
    }

    # The site itself.
    location / {
        auth_request /__auth;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}