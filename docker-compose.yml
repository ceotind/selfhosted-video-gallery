services:
  gallery:
    build: .
    container_name: video-gallery
    ports:
      - "${GALLERY_PORT:-8080}:80"
    environment:
      POSTER_WORKERS: "2"
      SESSION_DAYS: "30"
      # Comma separated list of admins.
      ADMIN_USERS: "dilshad"
      # Owner of the data folders on the host. Use your own id: run `id -u` and `id -g`.
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      # Point VIDEOS_DIR at the folder that holds your videos.
      - ${VIDEOS_DIR:-./videos}:/data/videos:ro
      # Logins are read from secrets/seed-users.txt on the first start only.
      - ${SEED_DIR:-./secrets}:/data/seed:ro
      # Everything the app writes lives in plain host folders under DATA_DIR.
      - ${DATA_DIR:-./data}/db:/data/db
      - ${DATA_DIR:-./data}/posters:/data/posters
      - ${DATA_DIR:-./data}/meta:/data/meta
    restart: unless-stopped