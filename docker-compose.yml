services:
  gallery:
    build: .
    container_name: video-gallery
    ports:
      - "${GALLERY_PORT:-8080}:80"
    environment:
      POSTER_WORKERS: "2"
    volumes:
      # Point VIDEOS_DIR at the folder that holds your videos.
      - ${VIDEOS_DIR:-./videos}:/data/videos:ro
      - gallery_posters:/data/posters
      - gallery_meta:/data/meta
    restart: unless-stopped

volumes:
  gallery_posters:
  gallery_meta:
